<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coach a Fighter Stats Calculator</title>
    <meta name="description" content="A Coach a Fighter stats calculator to analyze OVR, stats, and fighter builds.">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="masthead">
        <div class="eyebrow">Coach a Fighter Tool</div>

        <h1>
            Stats Calculator
        </h1>

        <div class="sub">
            Optimize your fighter build and maximize your OVR
        </div>
    </div>


    <!-- OVR HERO -->
    <div class="hero-panel">

        <div class="ovr-inputs-row">

            <div class="ovr-input-block">
                <label>Current OVR</label>
                <input id="currentOVR" type="number" value="61">
            </div>

            <div class="arrow-sep">
                →
            </div>

            <div class="ovr-input-block">
                <label>Target OVR</label>
                <input id="targetOVR" type="number" value="101">
            </div>

        </div>


        <div class="xp-track">
            <div class="xp-fill" id="xpFill"></div>
        </div>

        <div class="xp-labels">
            <span>Current</span>
            <span>Goal</span>
        </div>


        <div class="hero-stats-row">

            <div class="hero-stat">
                <div class="val accent" id="neededOVR">
                    40
                </div>
                <div class="lbl">
                    OVR Needed
                </div>
            </div>


            <div class="hero-stat">
                <div class="val" id="statGain">
                    400
                </div>
                <div class="lbl">
                    Stats Needed
                </div>
            </div>


        </div>

    </div>



    <div class="grid">


        <!-- LEFT SIDE -->
        <div>


            <div class="panel">

                <h2>
                    <span class="bar"></span>
                    Fighter Stats
                </h2>


                <div id="statsContainer">


                    <!-- Stats will appear here -->

                    <div class="stat-row">

                        <div class="stat-name">
                            <span class="dot"></span>
                            Power
                        </div>


                        <div class="field-mini">

                            <div class="fl">
                                Current
                            </div>

                            <input id="power" type="number" value="113">

                        </div>


                        <div class="field-mini">

                            <div class="fl">
                                Cap
                            </div>

                            <input id="powerCap" type="number" value="3000">

                        </div>


                    </div>



                </div>


                <button class="btn" id="calculateBtn">
                    Calculate
                </button>


            </div>




            <!-- COMPARE -->

            <div class="panel">

                <h2>
                    <span class="bar"></span>
                    Compare Two Stats
                </h2>


                <div class="compare-select-row">


                    <div class="compare-select-block">

                        <label>
                            Stat A
                        </label>

                        <select id="statASelect">
                            <option>Power</option>
                            <option>Agility</option>
                            <option>Dexterity</option>
                            <option>Stamina</option>
                            <option>Endurance</option>
                        </select>

                    </div>


                    <div class="vs-tag">
                        VS
                    </div>


                    <div class="compare-select-block">

                        <label>
                            Stat B
                        </label>

                        <select id="statBSelect">
                            <option>Agility</option>
                            <option>Power</option>
                            <option>Dexterity</option>
                            <option>Stamina</option>
                            <option>Endurance</option>
                        </select>

                    </div>


                </div>


                <button class="btn" id="compareBtn">
                    Compare Stats
                </button>


                <div id="compareResults"></div>


            </div>


        </div>



        <!-- RIGHT SIDE -->

        <div>


            <div class="panel">

                <h2>
                    <span class="bar"></span>
                    Save Build
                </h2>


                <div class="save-row">

                    <div class="save-input-block">

                        <label>
                            Build Name
                        </label>

                        <input id="buildNameInput"
                        placeholder="Power Build">

                    </div>


                    <button class="btn save-btn" id="saveBuildBtn">
                        Save
                    </button>


                </div>


            </div>



            <div class="panel">

                <h2>
                    <span class="bar"></span>
                    Build History
                </h2>


                <div id="historyList">

                    <div class="placeholder-note">
                        No builds saved yet.
                    </div>

                </div>


            </div>


        </div>


    </div>


</div>



<script src="script.js"></script>

</body>
</html>
